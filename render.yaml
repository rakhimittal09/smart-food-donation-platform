# Render Blueprint for Smart Food Donation Platform
# Deploys backend and frontend together as one service

services:
  - type: web
    name: smart-food-donation-app
    env: node
    region: oregon
    plan: free
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PORT
        value: 5000
    # No need for VITE_API_URL if frontend calls relative /api
