services:
  # ─────────────────────────────────────────────
  # Backend Web Service (Node.js API)
  # ─────────────────────────────────────────────
  - type: web
    name: smart-food-donation-backend
    env: node
    plan: free
    region: singapore          # closest to India
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false            # set manually in Render dashboard
      - key: JWT_SECRET
        generateValue: true    # Render auto-generates a secure random value
      - key: JWT_EXPIRE
        value: 7d
      - key: CLIENT_URL
        sync: false            # set to your frontend URL after first deploy

  # ─────────────────────────────────────────────
  # Frontend Static Site (React/Vite)
  # ─────────────────────────────────────────────
  - type: static
    name: smart-food-donation-frontend
    plan: free
    region: singapore
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite          # SPA fallback — all routes → index.html
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false            # set to: https://smart-food-donation-backend.onrender.com/api
